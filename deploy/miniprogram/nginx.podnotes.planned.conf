# Planned configuration only. Enable after hosting, filing, DNS and certificates are ready.
# Include inside nginx http {}. Keep the desktop API and port 8000 private.
limit_req_zone $binary_remote_addr zone=mini:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name api.podnotes.cloud;
    ssl_certificate /etc/letsencrypt/live/api.podnotes.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.podnotes.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    location /mini/ {
        limit_req zone=mini burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name api.podnotes.cloud;
    return 301 https://$host$request_uri;
}
