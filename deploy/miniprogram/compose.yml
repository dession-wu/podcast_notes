services:
  mini-api:
    build:
      context: ../..
      dockerfile: deploy/miniprogram/Dockerfile
      args:
        INSTALL_LOCAL_STT: ${INSTALL_LOCAL_STT:-false}
    env_file: .env
    environment:
      MINI_DEVELOPMENT: 'false'
      MINI_DEMO: 'false'
      MINI_DATA_DIR: /data
      MODELSCOPE_CACHE: /home/mini/.cache/modelscope
      HF_HOME: /home/mini/.cache/huggingface
    ports:
      - '127.0.0.1:8010:8010'
    volumes:
      - mini-data:/data
      - model-cache:/home/mini/.cache
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 8g
    cpus: 4
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  mini-data:
  model-cache:
