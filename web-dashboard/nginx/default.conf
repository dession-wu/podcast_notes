# Podcast Notes 前端 nginx 配置
# 职责: 托管 Next.js 静态导出文件 + 将 /api、/images 同源反代到 backend:8000

server {
    listen 80;
    server_name _;

    # 笔记内容上传（Markdown 较大）与音频下载代理场景
    client_max_body_size 50m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 后端 API 反代（同源，规避 CORS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 转写/笔记生成为长耗时任务，超时放宽
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 生成图片静态服务反代（backend 挂载的 /images）
    location /images/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Next.js 静态资源: 强缓存（文件名带内容哈希）
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 静态导出页面: SPA 回退到 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}