# Podcast Notes 前端 nginx 配置
# 职责: 托管 Next.js 静态导出文件 + 将 /api、/images 同源反代到 backend:8000

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 笔记内容上传（Markdown 较大）与音频下载代理场景
    # 音频本身最多 50 MiB，额外空间容纳 multipart 表单头。
    client_max_body_size 51m;

    # Gzip 压缩
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    open_file_cache max=4096 inactive=60s;
    open_file_cache_valid 30s;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location ~ ^/(login|register|account|logout|auth)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_read_timeout 60s;
    }
    # 后端 API 反代（同源，规避 CORS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 转写/笔记生成为长耗时任务，超时放宽
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 生成图片静态服务反代（backend 挂载的 /images）
    location /images/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Lossless public example previews; original PNG is kept for older clients.
    location /landing/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next.js 静态资源: 强缓存（文件名带内容哈希）
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 新增公开首页后，原登录界面独立在 /login；精确映射其静态导出文件。




    # 每个 Next.js 导出路由都有对应 .html；刷新深层页面也应加载该页面。
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
